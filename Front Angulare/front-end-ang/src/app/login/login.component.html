<div class="min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full p-6 bg-white rounded-lg shadow-lg">

    <div class="flex justify-center mb-8 ">
      <a routerLink="/" class="text-2xl font-serif font-bold tracking-wide overline text-blue-400">F F S</a>
    </div>

    <h1 class="text-2xl font-semibold text-center text-gray-500 mt-8 mb-6">Se connecter</h1>

    <form [formGroup]="loginForm">
      <!-- Email -->
      <div class="mb-4">
        <label class="block mb-2 text-sm text-gray-600">E-mail</label>
        <input matInput formControlName="email" placeholder="Email" class="w-full px-4 py-2 border text-cyan-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500" required>

        <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Saisie un Email valide.
        </mat-error>
      </div>

      <!-- PWD -->
      <div class="mb-4">
        <label class="block mb-2 text-sm text-gray-600">Mot de passe</label>
        <input matInput type="{{ hidePassword ? 'password' : 'text'}}" formControlName="password" placeholder="Mot de passe" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-cyan-600" required>

        <button mat-icon-button matSuffix (click)="toggelPasswordVisibility()" class="bg-cyan-600 bg-rounder">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>

        <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Saisie un mot de passe valide.
        </mat-error>
      </div>

      <!-- Confirmation -->
      <button type="submit" class="w-32 bg-gradient-to-r from-cyan-400 to-cyan-600 text-white py-2 rounded-lg mx-auto block focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 mb-2" (click)="onSubmit()" [disabled]="loginForm.invalid">Login</button>


    </form>
    <div class="text-center">
      <a class="text-cyan-600" routerLink="/signup">vous n'avez pas un compte ? s'inscrire maintenant</a>
    </div>
  </div>
</div>
