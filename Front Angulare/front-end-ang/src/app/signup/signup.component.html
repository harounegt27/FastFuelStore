<div class="min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full p-6 bg-white rounded-lg shadow-lg">

    <div class="flex justify-center mb-8">
      <a routerLink="/" class="text-2xl font-serif font-bold tracking-wide overline text-blue-400">F F S</a>
    </div>

    <h1 class="text-2xl font-semibold text-center text-gray-500 mt-8 mb-6">S'inscrire</h1>

    <form [formGroup]="signupForm">

      <!-- Nom -->
      <div class="mb-4">
        <label class="block mb-2 text-sm text-gray-600">Nom</label>
        <input matInput formControlName="name" placeholder="Nom" class="w-full font-medium px-4 py-2 border text-cyan-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500" required>

        <mat-error *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched">
          Saisie un nom valide.
        </mat-error>
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block mb-2 text-sm text-gray-600">E-mail</label>
        <input matInput formControlName="email" placeholder="Email" class="w-full px-4 py-2 border text-cyan-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500" required>
        <mat-error *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
          Saisie un Email valide.
        </mat-error>
      </div>

      <!-- PWD -->
      <div class="mb-4">
        <label class="block mb-2 text-sm text-gray-600">Mot de passe</label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Mot de passe" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-cyan-600" required>
        <button mat-icon-button matSuffix (click)="toggelPasswordVisibility()" class="bg-cyan-600 rounded">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
          <ng-container *ngIf="signupForm.get('password')?.errors?.['required']">
            Saisie un mot de passe.
          </ng-container>
          <ng-container *ngIf="signupForm.get('password')?.errors?.['minlength']">
            Mot de passe doit être au moins 8 caractères.
          </ng-container>
        </mat-error>
      </div>

      <!-- CPWD -->
      <div class="mb-4">
        <label class="block mb-2 text-sm text-gray-600"> Confirmé votre mot de passe</label>
        <input matInput type="{{ hidePassword ? 'password' : 'text'}}" formControlName="confirmPassword" placeholder="Confirmé mot de passe" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-cyan-600" required>
        <button mat-icon-button matSuffix (click)="toggelPasswordVisibility()" class="bg-cyan-600 bg-rounder">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-error *ngIf="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched">
          Confirme votre mot de passe
        </mat-error>
      </div>
      <!-- Confirmation -->
      <button type="submit" class="w-32 bg-gradient-to-r from-cyan-400 to-cyan-600 text-white py-2 rounded-lg mx-auto block focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 mb-2" (click)="onSubmit()" [disabled]="signupForm.invalid">Sign Up</button>

    </form>
  </div>
</div>
