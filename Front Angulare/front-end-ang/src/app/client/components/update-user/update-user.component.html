<div class="min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full p-6 bg-white rounded-lg shadow-lg">

    <div class="flex justify-center mb-8">
      <a routerLink="/" class="text-2xl font-serif font-bold tracking-wide overline text-blue-400">F F S</a>
    </div>

    <h1 class="text-2xl font-semibold text-center text-gray-500 mt-8 mb-6">Modifier Compte</h1>

    <form [formGroup]="updateForm">

      <!-- Nom -->
      <div class="mb-4">
        <label class="block mb-2 text-sm text-gray-600">Nom</label>
        <input matInput formControlName="name" placeholder="Nom" class="w-full font-medium px-4 py-2 border text-cyan-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500" required>

        <mat-error *ngIf="updateForm.get('name')?.invalid && updateForm.get('name')?.touched">
          Saisie un nom valide.
        </mat-error>
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block mb-2 text-sm text-gray-600">E-mail</label>
        <input matInput formControlName="email" placeholder="Email" class="w-full px-4 py-2 border text-cyan-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500" required>
        <mat-error *ngIf="updateForm.get('email')?.invalid && updateForm.get('email')?.touched">
          Saisie un Email valide.
        </mat-error>
      </div>


      <!-- Confirmation -->
      <button type="submit" class="w-32 bg-gradient-to-r from-cyan-400 to-cyan-600 text-white py-2 rounded-lg mx-auto block focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 mb-2" (click)="onSubmit()" [disabled]="updateForm.invalid">Modifier</button>
      <button  class="w-32 bg-gradient-to-r from-red-400 to-red-600 text-white py-2 rounded-lg mx-auto block focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 mb-2" (click)="deleteUser()" >Supprimer Compte</button>

    </form>
  </div>
</div>
